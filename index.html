<script>
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ===== 文本编码修复：仅修复高置信度 Latin-1/UTF-8 乱码 =====
function fixRussianEncoding(str) {
  if (!str || typeof str !== 'string') return str;
  function mojibakeScore(value) {
    const replacementChars = (value.match(/\uFFFD/g) || []).length;
    const controlChars = (value.match(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g) || []).length;
    const mojibakeMarkers = (value.match(/[ÃÂÐÑРС]/g) || []).length;
    return replacementChars * 12 + controlChars * 8 + mojibakeMarkers * 2;
  }
  const originalScore = mojibakeScore(str);
  if (originalScore === 0) return str;
  try {
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code > 0xFF) return str;
      bytes[i] = code;
    }
    const decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    return mojibakeScore(decoded) < originalScore ? decoded : str;
  } catch (e) {
    return str;
  }
}

</head>
<body>
<div class="hero-section">
  <h1 class="hero-title">店雷达 OZON 选品助手</h1>
  <p class="hero-subtitle">俄罗斯电商选品 · 数据分析 · 市场调研</p>
  <div class="search-box-container">
    <div class="search-box">
      <textarea id="search-input" class="search-input" placeholder="想找什么类目商品？用中文描述需求，AI帮你分析OZON选品，比如：连衣裙、手机壳、户外用品..."></textarea>
      <div class="search-box-footer">
        <div class="search-box-left">
          <button class="icon-btn" title="历史">🕒</button>
        </div>
        <div class="search-box-right">
          <span class="mode-toggle">✨ AI智能分析</span>
          <button id="search-btn" class="search-btn">🔍 搜索</button>

    </div>
    <div class="tip-banner">
      <div class="tip-banner-left">✨ AI智能分析关键词，精准匹配OZON热销商品</div>
      <div class="tip-banner-right">🛡️ 免费体验</div>
    </div>
    <div id="search-history" class="search-history" style="display:none;">
      <div class="search-history-header">
        <span class="search-history-title">最近搜索</span>
        <button class="search-history-clear" id="clear-history">清空</button>
      </div>
      <div class="search-history-tags" id="history-tags"></div>
    </div>
  </div>
  <div class="quick-tools">
    <div class="tool-item"><div class="tool-icon">🔥</div><span class="tool-name">热门</span></div>
    <div class="tool-item"><div class="tool-icon">👗</div><span class="tool-name">连衣裙选品</span></div>
    <div class="tool-item"><div class="tool-icon">👚</div><span class="tool-name">女装上装</span></div>
    <div class="tool-item"><div class="tool-icon">👖</div><span class="tool-name">女装下装</span></div>
    <div class="tool-item"><div class="tool-icon">👙</div><span class="tool-name">泳衣沙滩装</span></div>
    <div class="tool-item"><div class="tool-icon">👜</div><span class="tool-name">箱包配饰</span></div>
  </div>
</div>
<div id="results" class="results-section">
  <div id="analysis-loading" class="analysis-card" style="display:none;">
    <div class="analysis-header">
      <div class="analysis-header-icon">🧠</div>
      <div class="analysis-header-text">
        <div class="analysis-header-title">AI智能分析</div>
        <div id="analysis-sub" class="analysis-header-sub">正在启动AI分析引擎...</div>
      </div>
    </div>
    <div id="ai-steps" class="ai-steps"></div>
    <div id="analysis-timing" class="analysis-timing"></div>
  </div>
  <div class="products-header">
    <div>
      <div class="products-title">推荐商品</div>
      <div id="products-count" class="products-count">0 件</div>
    </div>
    <div class="filter-row">
      <span class="filter-label">排序：</span>
      <div id="sort-chips" class="chip-group"></div>
    </div>
  </div>
  <div id="category-chip-row" style="display:none;"></div>
  <div id="product-grid" class="product-grid">
    <div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">正在搜索商品...</div>
  </div>
</div>
<script>
// ===== 全局常量 =====
const APP_ID = 'kl8d0f9x3m';
const APP_SECRET = '85f06e44d5b04a278ea3a6f7c9b2f1d3';
const OPEN_API_BASE = 'https://open.dianleida.net/api/v1';
const OZON_SEARCH_PATH = '/ozon/search';
const OZON_CNY_RATE = 0.09;
// ===== MD5 签名生成 =====
function generateNonceStr() {
  if (window.crypto && window.crypto.getRandomValues) {
    const bytes = new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
  }
  return Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
}
function buildSign(params, appSecret) {
  const sortedKeys = Object.keys(params).filter(k => k !== 'sign' && params[k] !== '' && params[k] !== null && params[k] !== undefined).sort();
  const sortedStr = sortedKeys.map(k => {
    const value = Array.isArray(params[k]) ? '[' + params[k].join(',') + ']' : params[k];
    return k + '=' + value;
  }).join('&');
  const signStr = 'appSecret=' + appSecret + '&' + sortedStr + '&appSecret=' + appSecret;
  return md5(signStr);
}
// ===== 调用店雷达官方开放 REST 接口 =====
async function callOzonSearch(bizParams) {
  const nonceStr = generateNonceStr();
  const allParamsForSign = Object.assign({}, bizParams, { appId: APP_ID, nonceStr: nonceStr });
  const sign = buildSign(allParamsForSign, APP_SECRET);
  const url = OPEN_API_BASE + OZON_SEARCH_PATH;
  const requestBody = Object.assign({}, bizParams, { appId: APP_ID, nonceStr: nonceStr, sign: sign });
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json;charset=utf-8' },
    body: JSON.stringify(requestBody)
  });
  const data = await resp.json().catch(() => ({}));
  if (data && data.code === 200) {
    return {
      list: (data.result && data.result.list) || [],
      totalCount: (data.result && data.result.totalCount) || 0,
      totalPages: (data.result && data.result.totalPages) || 0,
      pageIndex: (data.result && data.result.pageIndex) || 1,
      pageSize: (data.result && data.result.pageSize) || 0
    };
  }
  throw new Error('官方接口错误: code=' + (data && data.code) + ', msg=' + (data && data.msg));
}
// ===== OZON 类目发现：先获取类目再搜索商品 =====
async function callCozeCategoryBot(query) {
  try {
    const result = await callOzonSearch({
      pageIndex: 1,
      pageSize: 50,
      keyWord: query,
      searchType: 3
    });
    const counts = new Map();
    (result.list || []).forEach(function (item) {
      const id = String(item.typeId || '');
      const name = fixRussianEncoding(String(item.levelName || '')).trim();
      if (!id || !name) return;
      const current = counts.get(id) || { id: id, name: name, count: 0 };
      current.count++;
      counts.set(id, current);
    });
    return Array.from(counts.values())
      .sort(function (a, b) { return b.count - a.count; })
      .slice(0, 8)
      .map(function (item) { return { id: item.id, name: item.name }; });
  } catch (e) {
    console.warn('[OZON Category] 获取失败:', e.message);
    return [];
  }
}
var currentCategoryTree = [];
var excludedCategoryIds = new Set();
function getActiveCategoryIdList() {
  return currentCategoryTree.filter(function (c) { return !excludedCategoryIds.has(c.id); }).map(function (c) { return c.id; });
}
function renderCategoryChips() {
  var container = document.getElementById('category-chip-row');
  if (!container) return;
  if (!currentCategoryTree || currentCategoryTree.length === 0) {
    container.innerHTML = '';
    container.style.display = 'none';
    return;
  }
  container.style.display = 'block';
  var activeCount = getActiveCategoryIdList().length;
  var chips = currentCategoryTree.map(function (cat) {
    var active = !excludedCategoryIds.has(cat.id);
    var cls = active ? 'chip active' : 'chip';
    return '<span class="' + cls + '" data-cat-id="' + cat.id + '" onclick="toggleCategory(\'' + cat.id + '\')">' + escapeHtml(cat.name) + '</span>';
  }).join('');
  container.innerHTML = '<div style="margin:8px 0 4px;color:#666;font-size:13px;">🎯 类目筛选 · 已应用 ' + activeCount + ' 个类目 <span class="chip" onclick="restoreAllCategories()">恢复全部</span></div><div class="chip-group">' + chips + '</div>';
}
async function toggleCategory(catId) {
  if (!catId) return;
  if (excludedCategoryIds.has(catId)) excludedCategoryIds.delete(catId);
  else excludedCategoryIds.add(catId);
  renderCategoryChips();
  await rerunSearchWithCategories();
}
async function restoreAllCategories() {
  excludedCategoryIds.clear();
  renderCategoryChips();
  await rerunSearchWithCategories();
}
async function rerunSearchWithCategories() {
  var aiResult = window.__lastAiResult || null;
  var query = document.getElementById('search-input').value || '';
  if (!query) return;
  var categoryIdList = getActiveCategoryIdList();
  var result = await fetchProductsFromAPI(query, aiResult, { categoryIdList: categoryIdList });
  if (result && Array.isArray(result.products) && result.products.length > 0) {
    renderProducts(result.products);
  } else {
    showCategoryEmptyHint();
  }
}
function showCategoryEmptyHint() {
  document.getElementById('product-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">该筛选下暂无结果，请取消部分类目或点击"恢复全部"</div>';
  document.getElementById('products-count').textContent = '0 件';
}
// ===== 商品数据处理 =====
async function fetchProductsFromAPI(keyword, aiResult, options) {
  const opts = options || {};
  const categoryIdList = Array.isArray(opts.categoryIdList) ? opts.categoryIdList.map(String).filter(Boolean).slice(0, 20) : [];
  if (categoryIdList.length === 0) throw new Error('缺少类目ID，禁止全局搜索');
  const allProducts = [];
  const seenIds = new Set();
  async function trySearchOneSource(keyWord, pageSize, catIds) {
    const bizParams = { pageIndex: 1, pageSize: pageSize, keyWord: keyWord, searchType: 3 };
    if (!catIds || catIds.length === 0) throw new Error('缺少类目ID，禁止全局搜索');
    bizParams.categoryIdList = catIds;
    return await callOzonSearch(bizParams);
  }
  try {
    const r = await trySearchOneSource(keyword, 50, categoryIdList);
    (r.list || []).forEach(function (p) { if (!seenIds.has(p.id)) { seenIds.add(p.id); allProducts.push(p); } });
  } catch (e) {
    console.warn('主搜索失败:', e.message);
  }
  return { products: allProducts, categoryStats: [] };
}
function renderProducts(products) {
  var grid = document.getElementById('product-grid');
  if (!products || products.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">暂无商品</div>';
    document.getElementById('products-count').textContent = '0 件';
    return;
  }
  document.getElementById('products-count').textContent = products.length + ' 件';
  grid.innerHTML = products.map(function (p) {
    var title = fixRussianEncoding(String(p.title || p.name || ''));
    return '<a class="product-card" target="_blank" href="' + (p.url || '#') + '">' +
      '<div class="product-img-wrap"><img class="product-img" src="' + (p.image || p.imageUrl || '') + '" loading="lazy" onerror="this.outerHTML=\'<div class=product-img-placeholder>📦</div>\'"></div>' +
      '<div class="product-info"><div class="product-title">' + escapeHtml(title) + '</div>' +
      '<div class="product-price">¥ ' + (p.price || '--') + '</div></div></a>';
  }).join('');
}
// ===== 主流程：先获取类目，再搜索商品 =====
async function doSearch() {
  var query = (document.getElementById('search-input').value || '').trim();
  if (!query) return;
  document.getElementById('results').classList.add('active');
  document.getElementById('analysis-loading').style.display = 'block';
  document.getElementById('product-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">正在搜索商品...</div>';
  try {
    currentCategoryTree = await callCozeCategoryBot(query);
    renderCategoryChips();
    if (!currentCategoryTree.length) {
      document.getElementById('product-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">未获取到有效类目，请尝试其他关键词</div>';
      return;
    }
    var categoryIdList = currentCategoryTree.map(function (c) { return c.id; }).slice(0, 20);
    var result = await fetchProductsFromAPI(query, null, { categoryIdList: categoryIdList });
    renderProducts(result.products);
  } catch (e) {
    console.warn('搜索失败:', e.message);
    document.getElementById('product-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">搜索失败：' + e.message + '</div>';
  }
}
document.getElementById('search-btn').addEventListener('click', doSearch);
</script>
</body>
