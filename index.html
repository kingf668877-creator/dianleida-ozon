<script>
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// ===== 文本编码修复：仅修复高置信度 Latin-1/UTF-8 乱码 =====
function fixRussianEncoding(str) {
  if (!str || typeof str !== 'string') return str;
  function mojibakeScore(value) {
    const replacementChars = (value.match(/\uFFFD/g) || []).length;
    const controlChars = (value.match(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g) || []).length;
    const mojibakeMarkers = (value.match(/[ÃÂÐÑРС]/g) || []).length;
    return replacementChars * 12 + controlChars * 8 + mojibakeMarkers * 2;
  }
  const originalScore = mojibakeScore(str);
  if (originalScore === 0) return str;
  try {
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code > 0xFF) return str;
      bytes[i] = code;
    }
    const decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    return mojibakeScore(decoded) < originalScore ? decoded : str;
  } catch (e) {
    return str;
  }
}

<script>
// ===== 店雷达官方开放 REST 接口配置 =====
// 按官方文档《店雷达接入说明》，对接 OZON 选品库接口：
//   POST https://open.dianleida.net/api/v1/ozon/search
// 鉴权方式：appId + nonceStr + sign 放在请求体中，MD5 签名
// 签名格式：appSecret={value}&{sorted_params}&appSecret={value}
// CORS 已开放（Access-Control-Allow-Origin: *），浏览器可直接调用
const OPEN_API_BASE = 'https://open.dianleida.net';
const OZON_SEARCH_PATH = '/api/v1/ozon/search';
const APP_ID = '56a337d738712dd3';
const APP_SECRET = '3d24d39a56a337d738712dd32ca4f899';
// ===== MD5 签名生成（使用 blueimp-md5 CDN 库） =====
// window.md5 由 blueimp-md5 库提供
function generateNonceStr() {
  if (window.crypto && window.crypto.getRandomValues) {
    const bytes = new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
  }
  return Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
}
function buildSign(params, appSecret) {
  // 1. 除 sign 外按 key 字典排序，空值不参与签名
  const sortedKeys = Object.keys(params).filter(k => k !== 'sign' && params[k] !== '' && params[k] !== null && params[k] !== undefined).sort();
  const sortedStr = sortedKeys.map(k => { const v = Array.isArray(params[k]) ? '[' + params[k].join(',') + ']' : params[k]; return k + '=' + v; }).join('&');
  // 2. appSecret 加首尾：appSecret={value}&{sorted_params}&appSecret={value}
  const signStr = 'appSecret=' + appSecret + '&' + sortedStr + '&appSecret=' + appSecret;
  // 3. MD5 小写
  return md5(signStr);
}
// ===== 调用店雷达官方开放 REST 接口（ozon/search） =====
// POST https://open.dianleida.net/api/v1/ozon/search
// 鉴权方式：appId + nonceStr + sign 放在请求体中
// sign: MD5( "appSecret=" + appSecret + "&" + 排序后的"完整参数串" + "&appSecret=" + appSecret )
//      其中"完整参数串" = appId + nonceStr + 业务参数 全部参与签名（空值不参与）
async function callOzonSearch(bizParams) {
  // 1. 生成 nonceStr（32位随机数，GUID格式）
  const nonceStr = generateNonceStr();
  // 2. 构造完整签名字典：appId + nonceStr + 业务参数（公共参数也必须参与签名）
  const allParamsForSign = Object.assign({}, bizParams, {
    appId: APP_ID,
    nonceStr: nonceStr
  });
  // 3. 字典排序签名
  const sign = buildSign(allParamsForSign, APP_SECRET);
  // 4. POST 请求（所有参数放在请求体中，不使用 header 鉴权）
  const url = OPEN_API_BASE + OZON_SEARCH_PATH;
  const requestBody = Object.assign({}, bizParams, {
    appId: APP_ID,
    nonceStr: nonceStr,
    sign: sign
  });
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json;charset=utf-8'
    },
    body: JSON.stringify(requestBody)
  });
  const data = await resp.json().catch(() => ({}));
  // code: 200 成功；其他失败
  if (data && data.code === 200) {
    return {
      list: (data.result && data.result.list) || [],
      totalCount: (data.result && data.result.totalCount) || 0,
      totalPages: (data.result && data.result.totalPages) || 0,
      pageIndex: (data.result && data.result.pageIndex) || 1,
      pageSize: (data.result && data.result.pageSize) || 0
    };
  }
  throw new Error('官方接口错误: code=' + (data && data.code) + ', msg=' + (data && data.msg));
}
// ===== 扣子智能体配置 =====
const USE_COZE_AGENT = true;
const COZE_BOT_ID = '7665184702596169782';
const COZE_CATEGORY_BOT_ID = '';
const COZE_API_TOKEN = 'sat_M2oVUcRcmShLQVJuvMdLm7K7DSxC9KvvuZI8Yj9eqt4uSvelfMmeMsYSGqveGK1m';
const COZE_API_URL = 'https://api.coze.cn/v3/chat';
// ===== 调用扣子智能体API（流式）=====
let COZE_DEBUG_LOG = [];
function addDebugLog(msg) {
  const time = new Date().toLocaleTimeString();
  COZE_DEBUG_LOG.push(`[${time}] ${msg}`);
  if (COZE_DEBUG_LOG.length > 50) COZE_DEBUG_LOG.shift();
  console.log('[Coze Debug]', msg);
}
// 流式解析SSE响应
function parseSSE(response, onMessage, onComplete, onError) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let eventType = null;
  
  function processLine(line) {
    if (line.startsWith('event:')) {
      eventType = line.substring(6).trim();
    } else if (line.startsWith('data:')) {
      const dataStr = line.substring(5).trim();
      if (dataStr === '[DONE]') {
        onComplete && onComplete();
        return;
      }
      try {
        const data = JSON.parse(dataStr);
        onMessage && onMessage(eventType, data);
      } catch (e) {}
    }
  }
  
  function read() {
    reader.read().then(({ done, value }) => {
      if (done) {
        onComplete && onComplete();
        return;
      }
      
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      
      for (const line of lines) {
        if (line.trim()) {
          processLine(line.trim());
        }
      }
      
      read();
    }).catch(err => {
      onError && onError(err);
    });
  }
  
  read();
}
async function callCozeBot(botId, query, onStreamDelta) {
  if (!USE_COZE_AGENT || !COZE_API_TOKEN || !botId) return null;
  
  addDebugLog(`调用智能体[${botId}]: "${query}"`);
  
  try {
    const chatBody = JSON.stringify({
      bot_id: botId,
      user_id: 'dianleida_ozon_' + Date.now(),
      stream: true,
      auto_save_history: true,
      additional_messages: [
        { role: 'user', content: query, content_type: 'text' }
      ]
    });
    
    addDebugLog('发起流式对话请求（超时60秒）...');
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);
    
    const response = await fetch(COZE_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + COZE_API_TOKEN,
        'Accept': 'text/event-stream'
      },
      body: chatBody,
      signal: controller.signal
    });
    
    clearTimeout(timeoutId);
    
    if (!response.ok) {
      const errText = await response.text().catch(() => '');
      throw new Error('HTTP ' + response.status + ': ' + errText.substring(0, 200));
    }
    
    return new Promise((resolve, reject) => {
      let answerContent = '';
      let hasError = false;
      let errorMsg = '';
      let answerStarted = false;
      
      const sseTimeoutId = setTimeout(() => {
        addDebugLog('SSE解析超时60秒，强制结束');
        if (answerContent && answerContent.length > 10) {
          try {
            const json = extractJSON(answerContent);
            if (json) {
              addDebugLog('超时但提取到JSON，返回结果');
              resolve(json);
              return;
            }
          } catch(e) {}
        }
        reject(new Error('智能体分析超时（60秒），请重试'));
      }, 60000);
      
      parseSSE(
        response,
        (eventType, data) => {
          addDebugLog(`收到事件: ${eventType}, data.type: ${data.type || 'N/A'}, content长度: ${(data.content || '').length}`);
          
          if (eventType === 'conversation.message.delta') {
            const msgType = data.type || '';
            const content = data.content || '';
            const reasoningContent = data.reasoning_content || '';
            
            if (msgType === 'answer') {
              answerStarted = true;
              const textChunk = content || reasoningContent;
              if (textChunk) {
                answerContent += textChunk;
                if (onStreamDelta) {
                  onStreamDelta(textChunk, answerContent);
                }
              }
            } else if (!answerStarted && msgType === '' && content) {
              if (content.trim().startsWith('{') || answerContent.length > 0) {
                answerContent += content;
                if (onStreamDelta) {
                  onStreamDelta(content, answerContent);
                }
              }
            }
          } else if (eventType === 'conversation.message.completed') {
            const msgType = data.type || '';
            const content = data.content || '';
            const reasoningContent = data.reasoning_content || '';
            addDebugLog(`消息完成, type: ${msgType}, content长度: ${content.length}, reasoning长度: ${reasoningContent.length}`);
            if (msgType === 'answer') {
              const finalText = content || reasoningContent;
              if (finalText) {
                answerContent = finalText;
              }
            }
          } else if (eventType === 'conversation.chat.failed') {
            hasError = true;
            const lastError = data.last_error || {};
            errorMsg = lastError.msg || '未知错误';
            addDebugLog(`对话失败: ${errorMsg}`);
          }
        },
        () => {
          clearTimeout(sseTimeoutId);
          if (hasError) {
            reject(new Error(errorMsg || '扣子智能体调用失败'));
            return;
          }
          
          addDebugLog(`流式完成，回答内容长度: ${answerContent.length}`);
          
          let contentToParse = answerContent;
          if (!contentToParse || contentToParse.length < 10) {
            addDebugLog('answer内容为空，尝试从完整内容中提取JSON');
            reject(new Error('未获取到有效的回答内容'));
            return;
          }
          
          try {
            const result = JSON.parse(contentToParse);
            addDebugLog('JSON解析成功');
            resolve(result);
          } catch (e) {
            addDebugLog('直接解析失败，尝试提取第一个完整JSON...');
            
            let depth = 0;
            let start = -1;
            let end = -1;
            for (let i = 0; i < contentToParse.length; i++) {
              if (contentToParse[i] === '{') {
                if (depth === 0) start = i;
                depth++;
              } else if (contentToParse[i] === '}') {
                depth--;
                if (depth === 0 && start >= 0) {
                  end = i;
                  break;
                }
              }
            }
            
            if (start >= 0 && end > start) {
              const extracted = contentToParse.substring(start, end + 1);
              try {
                const result = JSON.parse(extracted);
                addDebugLog('提取第一个JSON对象成功，长度: ' + extracted.length);
                resolve(result);
                return;
              } catch (e2) {
                addDebugLog('提取的JSON解析失败: ' + e2.message);
              }
            }
            
            addDebugLog('尝试提取最后一个JSON...');
            let lastStart = -1;
            let lastEnd = -1;
            depth = 0;
            for (let i = contentToParse.length - 1; i >= 0; i--) {
              if (contentToParse[i] === '}') {
                if (depth === 0) lastEnd = i;
                depth++;
              } else if (contentToParse[i] === '{') {
                depth--;
                if (depth === 0 && lastEnd >= 0) {
                  lastStart = i;
                  break;
                }
              }
            }
            
            if (lastStart >= 0 && lastEnd > lastStart) {
              const extracted = contentToParse.substring(lastStart, lastEnd + 1);
              try {
                const result = JSON.parse(extracted);
                addDebugLog('提取最后一个JSON对象成功，长度: ' + extracted.length);
                resolve(result);
                return;
              } catch (e3) {
                addDebugLog('最后一个JSON解析也失败: ' + e3.message);
              }
            }
            
            addDebugLog('所有JSON解析尝试失败，原始内容前300字: ' + contentToParse.substring(0, 300));
            // 尝试补全截断的 JSON（截到 products 之前，补上 products:[]）
            addDebugLog('尝试自动补全截断的 JSON...');
            const truncatedIdx = contentToParse.indexOf('"products"');
            if (truncatedIdx > 0) {
              let prefix = contentToParse.substring(0, truncatedIdx);
              // 补全 prefix 末尾的逗号和 products
              prefix = prefix.trimEnd();
              if (prefix.endsWith(',')) {
                prefix = prefix.substring(0, prefix.length - 1);
              }
              const patched = prefix + ', "products": [], "truncated": true, "_warning": "JSON被max_tokens截断，已自动补全"}';
              try {
                const result = JSON.parse(patched);
                addDebugLog('自动补全 JSON 成功，长度: ' + patched.length);
                resolve(result);
                return;
              } catch (e4) {
                addDebugLog('自动补全失败: ' + e4.message);
              }
            }
            reject(new Error('返回内容不是有效的JSON格式'));
          }
        },
        (err) => {
          addDebugLog('流式读取失败: ' + err.message);
          reject(err);
        }
      );
    });
    
  } catch (e) {
    addDebugLog('最终失败: ' + e.message);
    console.warn('[Coze AI] 调用失败:', e.message);
    return null;
  }
}
function extractJSON(text) {
  if (!text) return null;
  try { return JSON.parse(text); } catch(e) {}
  let depth = 0, start = -1, end = -1;
  for (let i = 0; i < text.length; i++) {
    if (text[i] === '{') { if (depth === 0) start = i; depth++; }
    else if (text[i] === '}') { depth--; if (depth === 0 && start >= 0) { end = i; break; } }
  }
  if (start >= 0 && end > start) {
    try { return JSON.parse(text.substring(start, end + 1)); } catch(e) {}
  }
  return null;
}

// ===== 类目智能体：返回 categoryTree =====
async function callCozeCategoryBot(query) {
  try {
    const result = await callOzonSearch({
      pageIndex: 1,
      pageSize: 50,
      keyWord: query,
      searchType: 3
    });
    const counts = new Map();
    (result.list || []).forEach(function (item) {
      const id = String(item.typeId || '');
      const name = fixRussianEncoding(String(item.levelName || '')).trim();
      if (!id || !name) return;
      const current = counts.get(id) || { id: id, name: name, count: 0 };
      current.count++;
      counts.set(id, current);
    });
    return Array.from(counts.values())
      .sort(function (a, b) { return b.count - a.count; })
      .slice(0, 8)
      .map(function (item) { return { id: item.id, name: item.name }; });
  } catch (e) {
    console.warn('[OZON Category] 获取失败:', e.message);
    return [];
  }
}

// ===== 类目筛选状态 =====
var currentCategoryTree = [];
var excludedCategoryIds = new Set();
var activeCategorySearch = false;

function getActiveCategoryIdList() {
  return currentCategoryTree.filter(function (c) { return !excludedCategoryIds.has(c.id); }).map(function (c) { return c.id; });
}

function renderCategoryChips() {
  var container = document.getElementById('category-chip-row');
  if (!container) return;
  if (!currentCategoryTree || currentCategoryTree.length === 0) {
    container.innerHTML = '';
    container.style.display = 'none';
    return;
  }
  container.style.display = 'block';
  var activeCount = getActiveCategoryIdList().length;
  var chips = currentCategoryTree.map(function (cat) {
    var active = !excludedCategoryIds.has(cat.id);
    var cls = active ? 'chip active' : 'chip';
    var safeName = escapeHtml(cat.name);
    var safeId = String(cat.id).replace(/'/g, '&apos;');
    return '<span class="' + cls + '" data-cat-id="' + escapeHtml(cat.id) + '" onclick="toggleCategory(\'' + safeId + '\')">' + safeName + '</span>';
  }).join('');
  var summary = activeCount === currentCategoryTree.length
    ? '已应用 ' + activeCount + ' 个类目筛选（点击 chip 可取消）'
    : '已应用 ' + activeCount + '/' + currentCategoryTree.length + ' 个类目';
  container.innerHTML = '<div style="margin:8px 0 4px;color:#666;font-size:13px;">🎯 类目筛选 · ' + summary + ' <span class="chip" style="margin-left:8px;" onclick="restoreAllCategories()">恢复全部</span></div><div class="chip-group">' + chips + '</div>';
}

async function toggleCategory(catId) {
  if (!catId) return;
  if (excludedCategoryIds.has(catId)) excludedCategoryIds.delete(catId);
  else excludedCategoryIds.add(catId);
  renderCategoryChips();
  if (activeCategorySearch) return;
  activeCategorySearch = true;
  try {
    rerunSearchWithCategories().catch(function(e){console.warn(e.message)});
  } finally {
    activeCategorySearch = false;
  }
}

async function restoreAllCategories() {
  if (excludedCategoryIds.size === 0) return;
  excludedCategoryIds.clear();
  renderCategoryChips();
  if (activeCategorySearch) return;
  activeCategorySearch = true;
  try {
    rerunSearchWithCategories().catch(function(e){console.warn(e.message)});
  } finally {
    activeCategorySearch = false;
  }
}

async function rerunSearchWithCategories() {
  var aiResult = window.__lastAiResult || null;
  var query = (document.getElementById('search-input') || {}).value || '';
  if (!query) return;
  var categoryIdList = getActiveCategoryIdList();
  try {
    var result = await fetchProductsFromAPI(query, aiResult, { categoryIdList: categoryIdList });
    if (result && Array.isArray(result.products) && result.products.length > 0) {
      currentResults = result.products;
      renderProducts(result.products);
      window._lastApiError = '';
    } else {
      showCategoryEmptyHint();
    }

// ===== 处理OZON商品数据 =====
function processOzonProducts(items, excludedKeywords, requiredKeywords, coreProduct, layerHint, expandedWords, expandedTokenArr) {
  const result = [];
  const excluded = (excludedKeywords || []).map(k => k.toLowerCase());
  const required = (requiredKeywords || []).map(k => k.toLowerCase());
  const core = coreProduct ? coreProduct.toLowerCase() : '';
  const expWordList = (expandedWords || []).map(function(k){ return (k||'').toLowerCase(); }).filter(Boolean);
  const expTokens = (expandedTokenArr || []).map(function(k){ return (k||'').toLowerCase(); }).filter(Boolean);
  
  for (const item of items) {
    const subjectRaw = item.subject || '';
    const subject = fixRussianEncoding(subjectRaw);
    const subjectCnRaw = item.subjectCn || '';
    const subjectCn = fixRussianEncoding(subjectCnRaw);
    const levelName = fixRussianEncoding(item.levelName || '');
    
    const title = subject.toLowerCase();
    const titleCn = subjectCn.toLowerCase();
    
    let skip = false;
    for (const ex of excluded) {
      if (ex.length >= 2 && (title.includes(ex) || titleCn.includes(ex))) { skip = true; break; }
    }
    if (skip) continue;
    
    if (required.length > 0) {
      let matchCount = 0;
      for (const rq of required) {
        if (!rq) continue;
        const lowerRq = rq.toLowerCase();
        if (title.includes(lowerRq) || titleCn.includes(lowerRq)) matchCount++;
      }
      // 软化阈值：核心产品词命中 或 中文标题命中任何一个必需词即放行
      const threshold = required.length <= 2 ? 1 : Math.min(2, Math.ceil(required.length / 2));
      const coreMatched = core && (title.includes(core) || titleCn.includes(core));
      if (!coreMatched && matchCount < threshold) continue;
    }
    
    let relevanceScore = 0;
    if (core && (title.includes(core) || titleCn.includes(core))) relevanceScore += 10;
    
    // 中文关键词命中加分（中文关键词仅用于客户端匹配 subjectCn）
    let chineseMatch = false;
    for (const cnKw of (processOzonProducts._chineseKeywords || [])) {
      if (cnKw && titleCn.includes(cnKw.toLowerCase())) {
        relevanceScore += 8;
        chineseMatch = true;
      }
    }
    
    // 俄语关键词命中加分（俄语关键词仅用于客户端匹配 subject，俄语编码）
    let russianMatch = false;
    for (const ruKw of (processOzonProducts._russianKeywords || [])) {
      if (ruKw && title.includes(ruKw.toLowerCase())) {
        relevanceScore += 6;
        russianMatch = true;
      }
    }
    
    const salesScore = Math.min(2, Math.log10((item.saleQuantity30d || 0) + 1) / 3);
    relevanceScore += salesScore;
    
    if (item.score) relevanceScore += Math.min(2, item.score / 2.5);

    let layer = (typeof layerHint === 'number' && layerHint >= 1 && layerHint <= 5) ? layerHint : null;
    if (!layer) {
      const modArr = (processOzonProducts._modifiersArr || []);
      const modHits = [];
      for (const m of modArr) {
        if (!m) continue;
        if (title.includes(m.toLowerCase()) || titleCn.includes(m.toLowerCase())) modHits.push(m);
      }
      const reqHits = required.filter(function(rq){ return rq && (title.includes(rq) || titleCn.includes(rq)); }).length;
      const totalMods = modArr.filter(Boolean).length;
      if (reqHits === 0) layer = 99;
      else if (totalMods > 0 && modHits.length === totalMods) layer = 1;
      else if (modHits.length > 0) layer = 4;
      else layer = 5;
    }
    if (layer >= 4 && (expWordList.length || expTokens.length)) {
      let matchedWord = false;
      for (const w of expWordList) {
        if (w && (title.includes(w) || titleCn.includes(w))) { matchedWord = true; break; }
      }
      if (matchedWord && layer > 2) layer = 2;
      else {
        let matchedTok = false;
        for (const t of expTokens) {
          if (t && (title.includes(t) || titleCn.includes(t))) { matchedTok = true; break; }
        }
        if (matchedTok && layer > 3) layer = 3;
      }
    }

    result.push({
      id: String(item.offerId || ''),
      title: subject,
      titleCn: subjectCn,
      price: item.price || 0,
      priceRmb: item.priceRmb || 0,
      sales: item.saleQuantity30d || 0,
      saleVolume30d: item.saleVolume30d || 0,
      saleVolume30dRate: item.saleVolume30dRate || 0,
      score: item.score || 0,
      ratingNum: item.ratingNum || 0,
      img: item.image || '',
      link: item.offerUrl || '',
      category: levelName,
      typeId: String(item.typeId || ''),
      categoryName: levelName,
      companyType: item.companyType || 0,
      workingMode: item.workingMode || '',
      brand: fixRussianEncoding(item.brand || ''),
      matchedByChinese: chineseMatch,
      matchedByRussian: russianMatch,
      _layer: layer,
      _relevance: relevanceScore,
      _raw: item
    });
  }
  
  result.sort((a, b) => {
    const scoreDiff = (b._relevance || 0) - (a._relevance || 0);
    if (Math.abs(scoreDiff) > 0.01) return scoreDiff;
    return (b.sales || 0) - (a.sales || 0);
  });
  
  return result;

  // 三语五层二次精排
  try { var an = processOzonProducts._lastAnalysis || processOzonProducts._analysis || null; if (an && typeof window.applyCrossLangLayers === 'function') { var reranked = window.applyCrossLangLayers(result, an); if (Array.isArray(reranked) && reranked.length > 0) { result.length = 0; reranked.forEach(function(x){ result.push(x); }); } } } catch(e) {}
}
// ===== 从OZON MCP获取商品 =====
async function fetchProductsFromAPI(keyword, aiResult, options) {
  const allProducts = [];
  const opts = options || {};
  const categoryIdList = Array.isArray(opts.categoryIdList) ? opts.categoryIdList.map(String).filter(Boolean).slice(0, 1) : [];
  if (categoryIdList.length === 0) throw new Error('缺少类目ID，禁止全局搜索');
  const seenIds = new Set();
  
  const englishKeyword = (aiResult && aiResult.searchKeyword) || keyword;
  const expandedKeywords = (aiResult && aiResult.expandedKeywords) || [];
  const expandedTokenGroups = (aiResult && aiResult.expandedTokenGroups) || [];
  const russianKeywords = (aiResult && aiResult.russianKeywords) || [];
  const chineseKeywords = (aiResult && aiResult.chineseKeywords) || [];
  const excludedKeywords = (aiResult && aiResult.excludedKeywords) || [];
  const requiredKeywords = (aiResult && aiResult.requiredKeywords) || [];
  const coreProduct = (aiResult && aiResult.coreProduct) || keyword;
  const modifiers = (aiResult && aiResult.modifiers) || {};
  const allModifiers = []
    .concat(modifiers.style || []).concat(modifiers.material || [])
    .concat(modifiers.crowd || []).concat(modifiers.scene || []);
  processOzonProducts._chineseKeywords = chineseKeywords;
  processOzonProducts._russianKeywords = russianKeywords;
  processOzonProducts._modifiersArr = allModifiers;
  processOzonProducts._lastAnalysis = { requiredKeywords: requiredKeywords, modifiers: modifiers, expandedKeywords: expandedKeywords, expandedTokenGroups: (typeof expTokens !== 'undefined' ? expTokens : ((aiResult && aiResult.expandedTokenGroups) || [])), coreProduct: coreProduct };

  const mainSearchKeyword = (keyword && String(keyword).trim()) || englishKeyword;
  const requiredStr = (requiredKeywords[0] || coreProduct || mainSearchKeyword || '').toString().trim();
  const expTokensFlat = expandedTokenGroups.reduce(function(arr, g){ return arr.concat((g.tokens || []).filter(Boolean)); }, []);
  console.log('[五层搜索] 关键词:', mainSearchKeyword, '必含:', requiredKeywords, '扩展:', expandedKeywords, 'tokens:', expTokensFlat, '修饰:', allModifiers);
  // 用一个关键词搜索一次：只调用官方 REST 接口 /api/v1/ozon/search
  // searchType=3 精准匹配
  async function trySearchOneSource(keyWord, pageSize, catIds) {
    const bizParams = {
      pageIndex: 1,
      pageSize: pageSize,
      keyWord: keyWord,
      searchType: 3
    };
    if (!catIds || catIds.length === 0) throw new Error('缺少类目ID，禁止全局搜索');
    bizParams.categoryIdList = catIds;
    const result = await callOzonSearch(bizParams);
    if (!result || !result.list || result.list.length === 0) {
      throw new Error('官方接口返回空列表');
    }
    return { list: result.list, source: 'open' };
  }
  async function runLayer(layerNum, keyWords, pageSize) {
    const layerProducts = [];
    for (const kw of keyWords) {
      if (!kw) continue;
      try {
        const r = await trySearchOneSource(kw, pageSize, categoryIdList);
        const items = processOzonProducts(
          r.list,
          excludedKeywords,
          requiredKeywords,
          coreProduct,
          layerNum,
          expandedKeywords,
          expTokensFlat
        );
        for (const p of items) {
          if (!seenIds.has(p.id)) { seenIds.add(p.id); layerProducts.push(p); }
        }
      } catch (e) {
        console.warn('[L' + layerNum + '] 关键词 ' + kw + ' 失败:', e.message);
      }
    }
    return layerProducts;
  }

  const l1Words = [];
  if (requiredStr && allModifiers.length > 0) {
    l1Words.push([requiredStr].concat(allModifiers.slice(0, 4)).join(' ').trim());
    for (const m of allModifiers.slice(0, 3)) {
      l1Words.push([requiredStr, m].join(' ').trim());
    }
  } else if (requiredStr) {
    l1Words.push(requiredStr);
  }

  const l2Words = expandedKeywords.slice(0, 6);

  const l3Words = expandedTokenGroups
    .map(function(g){ return (g.tokens || []).filter(Boolean).join(' ').trim(); })
    .filter(Boolean)
    .slice(0, 6);

  const l4Words = [];
  if (requiredStr) {
    for (const m of allModifiers.slice(3, 8)) {
      l4Words.push([requiredStr, m].join(' ').trim());
    }
    if (l4Words.length === 0 && allModifiers[0]) {
      l4Words.push([requiredStr, allModifiers[0]].join(' ').trim());
    }
  }

  const l5Words = [];
  if (requiredStr) l5Words.push(requiredStr);
  if (l5Words.length === 0 && mainSearchKeyword) l5Words.push(mainSearchKeyword);

  console.log('[五层搜索] L1=' + l1Words.length + ' L2=' + l2Words.length + ' L3=' + l3Words.length + ' L4=' + l4Words.length + ' L5=' + l5Words.length);

  const layerResults = [];
  layerResults.push({ layer: 1, products: await runLayer(1, l1Words, 30) });
  layerResults.push({ layer: 2, products: await runLayer(2, l2Words, 30) });
  layerResults.push({ layer: 3, products: await runLayer(3, l3Words, 25) });
  layerResults.push({ layer: 4, products: await runLayer(4, l4Words, 25) });
  layerResults.push({ layer: 5, products: await runLayer(5, l5Words, 25) });

  for (const lr of layerResults) {
    for (const p of lr.products) allProducts.push(p);
  }

  if (allProducts.length < 5) {
    const fallbackWords = []
      .concat((russianKeywords || []).slice(0, 2))
      .concat((chineseKeywords || []).slice(0, 2))
      .concat([keyword])
      .filter(function(w){ return w && String(w).trim(); });
    const seenWords = new Set();
    const uniq = fallbackWords.filter(function(w){ const k = String(w).trim().toLowerCase(); if (seenWords.has(k)) return false; seenWords.add(k); return true; });
    for (const fw of uniq) {
      try {
        const r = await trySearchOneSource(fw, 30, categoryIdList);
        const items = processOzonProducts(r.list, excludedKeywords, requiredKeywords, coreProduct, 5, expandedKeywords, expTokensFlat);
        for (const p of items) {
          if (!seenIds.has(p.id)) { seenIds.add(p.id); allProducts.push(p); }
        }
        if (allProducts.length >= 20) break;
      } catch (e) {
        console.warn('[终极兜底] ' + fw + ' 失败:', e.message);
      }
    }
  }
  
  // 统计类目分布（用于展示，不做过滤）
  const categoryStats = {};
  for (const p of allProducts) {
    if (p.typeId) {
      if (!categoryStats[p.typeId]) {
        categoryStats[p.typeId] = { count: 0, name: p.categoryName || '' };
      }
      categoryStats[p.typeId].count++;
    }
  }
  
  // 排序取Top类目
  const topCategories = Object.entries(categoryStats)
    .sort((a, b) => b[1].count - a[1].count)
    .slice(0, 5)
    .map(([id, data]) => ({
      id: id,
      count: data.count,
      name: data.name || ('类目' + id),
      ratio: Math.round((data.count / allProducts.length) * 100)
    }));
  
  console.log('[类目分布]', topCategories);
  
  allProducts.sort(function(a, b) {
    const layerDiff = (a._layer || 99) - (b._layer || 99);
    if (layerDiff !== 0) return layerDiff;
    const relDiff = (b._relevance || 0) - (a._relevance || 0);
    if (Math.abs(relDiff) > 0.01) return relDiff;
    return (b.sales || 0) - (a.sales || 0);
  });

  return {
    products: allProducts,
    categoryId: '',
    categoryName: '',
    categoryStats: topCategories,
    totalCount: allProducts.length
  };
}

      modParts.push('场景：' + modifiers.scene.join('、'));
    }
    if (modParts.length > 0) {
      rows.push({ label: '修饰维度：', content: modParts.join(' ｜ ') });
    }
    
    // 4. 类目建议
    if (aiResult.categorySuggestion && aiResult.categorySuggestion.categoryName) {
      rows.push({ label: '推荐类目：', content: aiResult.categorySuggestion.categoryName });
    }
    
    rows.forEach((row, index) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'step-analysis-row';
      rowEl.style.animationDelay = (index * 0.12) + 's';
      rowEl.innerHTML = 
        '<span class="label">' + escapeHtml(row.label) + '</span>' +
        '<span class="keywords">' + escapeHtml(row.content) + '</span>';
      step1Box.appendChild(rowEl);
    });
    
    step1Content.appendChild(step1Box);
    
    // 关键词标签（搜索词 + 修饰词）
    const allMods = [];
    if (modifiers.style) allMods.push(...modifiers.style);
    if (modifiers.material) allMods.push(...modifiers.material);
    if (modifiers.crowd) allMods.push(...modifiers.crowd);
    if (modifiers.scene) allMods.push(...modifiers.scene);
    
    if (allMods.length > 0) {
      const tokensEl = document.createElement('div');
      tokensEl.className = 'ai-step-tokens';
      tokensEl.style.animationDelay = (rows.length * 0.12) + 's';
      tokensEl.innerHTML = 
        '<span class="ai-token main-token">' + escapeHtml(searchKeyword) + '</span>' +
        allMods.map(m => '<span class="ai-token">' + escapeHtml(m) + '</span>').join('');
      step1Content.appendChild(tokensEl);
    }
  }
  // ===== Step 2: 关键词扩展分析（渐变流式展示）=====
  setTimeout(function(){}, 300);
  const expanded = aiResult.expandedKeywords || [];
  const excluded = aiResult.excludedKeywords || [];
  const russianKeywords = aiResult.russianKeywords || [];
  const russianKeywordsExplain = aiResult.russianKeywordsExplain || [];
  const chineseKeywords = aiResult.chineseKeywords || [];
  const chineseKeywordsExplain = aiResult.chineseKeywordsExplain || [];
  
  // 构建候选词列表（修饰词 + 扩展词）
  const candidateKeywords = [];
  if (modifiers.style) candidateKeywords.push(...modifiers.style);
  if (modifiers.material) candidateKeywords.push(...modifiers.material);
  if (modifiers.scene) candidateKeywords.push(...modifiers.scene);
  if (expanded.length > 0) candidateKeywords.push(...expanded.slice(0, 6));
  
  // 选择的搜索词（主关键词 + 扩展词前3个）
  const selectedKeywords = [searchKeyword];
  if (expanded.length > 0) selectedKeywords.push(...expanded.slice(0, 3));
  
  let step2Detail = '候选 ' + candidateKeywords.length + ' 个 · 选择 ' + selectedKeywords.length + ' 个搜索词';

  if (chineseKeywords.length > 0) step2Detail += ' · 中文 ' + chineseKeywords.length + ' 个';
  if (excluded.length > 0) step2Detail += ' · 排除 ' + excluded.length + ' 个';
  
  addStep('🔗', 'Step 2: 搜索词分析扩展', step2Detail, null);
  
  // 添加渐变分析过程展示框
  const lastStep = document.getElementById('ai-steps').lastElementChild;

          content: russianKeywords.slice(0, 8).join('、') + (russianKeywords.length > 8 ? ' 等' : '')

      // 4. 中文关键词

        analysisRows.push({
          label: '中文：',
          content: chineseKeywords.slice(0, 8).join('、') + (chineseKeywords.length > 8 ? ' 等' : '')
        });

      // 5. 排除词

        analysisRows.push({
          label: '排除：',
          content: excluded.join('、')
        });
      }
      
      // 6. 原则/说明
      analysisRows.push({
        label: '原则：',
        content: '俄语词用于主搜索（词组匹配），中文词用于中文标题匹配，英文词作为备用搜索，排除词过滤不相关商品'
      });
      
      analysisRows.forEach((row, index) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'step-analysis-row';
        rowEl.style.animationDelay = (index * 0.15) + 's';
        rowEl.innerHTML = 
          '<span class="label">' + escapeHtml(row.label) + '</span>' +
          '<span class="keywords">' + escapeHtml(row.content) + '</span>';
        analysisBox.appendChild(rowEl);
      });
      
      contentEl.appendChild(analysisBox);
    }
  }
  
  // 俄语关键词详情框（如果有）
  if (russianKeywords.length > 0) {
    const russianEl = document.createElement('div');
    russianEl.className = 'russian-keywords-box';
    
    let keywordsHtml = '';
    if (russianKeywordsExplain && russianKeywordsExplain.length > 0) {
      keywordsHtml = russianKeywordsExplain.map(item => 
        '<span class="russian-keyword-item">' + 
          escapeHtml(item.keyword || item) + 
          (item.meaning ? ' <span class="meaning">(' + escapeHtml(item.meaning) + ')</span>' : '') +
        '</span>'
      ).join('');
    } else {
      keywordsHtml = russianKeywords.map(kw => 
        '<span class="russian-keyword-item">' + escapeHtml(kw) + '</span>'
      ).join('');
    }
    
    const russianText = russianKeywords.join(', ');
    
    russianEl.innerHTML = 
      '<div class="russian-keywords-title">🇷🇺 俄语关键词（主搜索词·词组匹配）</div>' +
      '<div class="russian-keywords-text">' + keywordsHtml + '</div>' +
      '<button class="copy-btn" onclick="navigator.clipboard.writeText(\'' + escapeHtml(russianText).replace(/'/g, "\\'") + '\');this.textContent=\'已复制✓\';this.classList.add(\'copied\');setTimeout(()=>{this.textContent=\'复制\';this.classList.remove(\'copied\')},2000)">复制全部</button>';
    
    const lastStep2 = document.getElementById('ai-steps').lastElementChild;
    if (lastStep2) {
      const contentEl2 = lastStep2.querySelector('.ai-step-content');
      if (contentEl2) contentEl2.appendChild(russianEl);
    }
  }
  
  // 中文关键词详情框（如果有）
  if (chineseKeywords.length > 0) {
    const chineseEl = document.createElement('div');
    chineseEl.className = 'chinese-keywords-box';
    
    let keywordsHtml = '';
    if (chineseKeywordsExplain && chineseKeywordsExplain.length > 0) {
      keywordsHtml = chineseKeywordsExplain.map(item => 
        '<span class="chinese-keyword-item">' + 
          escapeHtml(item.keyword || item) + 
          (item.meaning ? ' <span class="meaning">(' + escapeHtml(item.meaning) + ')</span>' : '') +
        '</span>'
      ).join('');
    } else {
      keywordsHtml = chineseKeywords.map(kw => 
        '<span class="chinese-keyword-item">' + escapeHtml(kw) + '</span>'

    }
    
    const chineseText = chineseKeywords.join(', ');
    
    chineseEl.innerHTML = 
      '<div class="chinese-keywords-title">🇨🇳 中文关键词（中文标题匹配）</div>' +

      '<button class="copy-btn" onclick="navigator.clipboard.writeText(\'' + escapeHtml(chineseText).replace(/'/g, "\\'") + '\');this.textContent=\'已复制✓\';this.classList.add(\'copied\');setTimeout(()=>{this.textContent=\'复制\';this.classList.remove(\'copied\')},2000)">复制全部</button>';
    
    const lastStep2 = document.getElementById('ai-steps').lastElementChild;
    if (lastStep2) {
      const contentEl2 = lastStep2.querySelector('.ai-step-content');
      if (contentEl2) chineseEl.style.cssText = 'margin-top:10px;';
      if (contentEl2) contentEl2.appendChild(chineseEl);
    }
  }
  
  // 英文搜索词标签
  if (expanded.length > 0) {
    const englishEl = document.createElement('div');
    englishEl.className = 'english-keywords-box';
    englishEl.innerHTML = 
      '<div class="english-keywords-title">🔤 英文搜索词（备用）</div>' +
      expanded.map(kw => '<span class="english-keyword-tag">' + escapeHtml(kw) + '</span>').join('');
    
    const lastStep3 = document.getElementById('ai-steps').lastElementChild;
    if (lastStep3) {
      const contentEl3 = lastStep3.querySelector('.ai-step-content');
      if (contentEl3) contentEl3.appendChild(englishEl);
    }
  }
  
  if (excluded.length > 0) {
    const excludedEl = document.createElement('div');
    excludedEl.style.cssText = 'margin-top:8px;font-size:12px;color:#9CA3AF;';
    excludedEl.innerHTML = '<span style="color:#9CA3AF;">排除词：</span>' + 
      excluded.slice(0, 6).map(k => '<span style="display:inline-block;padding:2px 8px;margin:2px;background:#FEF2F2;color:#EF4444;border-radius:10px;font-size:11px;">' + escapeHtml(k) + '</span>').join('');
    const lastStep4 = document.getElementById('ai-steps').lastElementChild;
    if (lastStep4) {
      const contentEl4 = lastStep4.querySelector('.ai-step-content');
      if (contentEl4) contentEl4.appendChild(excludedEl);
    }
  }
  // ===== Step 3: 类目分布分析（搜索后统计）=====
  setTimeout(function(){}, 250);
  const step3 = addLoadingStep('📊', 'Step 3: 类目分布分析中...', '搜索完成后将展示类目分布...');
  
  // ===== Step 4: 调用OZON MCP获取商品 =====
  const step4 = addLoadingStep('📡', 'Step 4: OZON商品搜索');
  
  let products = [];
  let categoryStats = [];
  let apiErrorMessage = '';
  const apiStartTime = performance.now();
  
  // 类目优先：必须先取得类目，再在类目范围内搜索商品
  try {
    window.__lastAiResult = aiResult;
    currentCategoryTree = await categoryPromise;
    excludedCategoryIds.clear();
    renderCategoryChips();

    if (!currentCategoryTree.length) {
      // 类目智能体已停用：兜底使用 6 个高频服装类目，避免无类目时直接抛错
      currentCategoryTree = [
        { id: '93175', name: '服装>服装>西装上衣' },
        { id: '93092', name: '服装>服装>开襟衫' },
        { id: '93082', name: '服装>服装>雨衣' },
        { id: '93048', name: '服装>服装>短衫' },
        { id: '93166', name: '服装>服装>大衣' },
        { id: '970851878', name: '服装>工作服>防蚊服' }
      ];
      excludedCategoryIds.clear();
      renderCategoryChips();
      console.warn('[类目优先] 类目智能体已停用，使用默认服装类目');
    }

    console.log('[类目优先] 搜索类目:', currentCategoryTree);
    // 店雷达开放接口的 categoryIdList 最多只接受 1 个类目 ID（超过即 code=401）。
    // 这里并行对每个 chip 调用一次 fetchProductsFromAPI，合并去重。
    const seenIds = new Set();
    const allProducts = [];
    let mergedStats = [];

    async function searchOneCategory(catId) {
      let lastErr = null;
      for (let retry = 0; retry < 3; retry++) {
        try {
          return await fetchProductsFromAPI(query, aiResult, { categoryIdList: [catId] });
        } catch (e) {
          lastErr = e;
          console.warn('[类目循环] 类目 ' + catId + ' 第 ' + (retry + 1) + ' 次失败: ' + e.message);
          await new Promise(function (s) { setTimeout(s, 400); });
        }
      }
      throw lastErr || new Error('类目 ' + catId + ' 搜索失败');
    }

    const activeCats = currentCategoryTree.filter(function (c) {
      return c && c.id && !excludedCategoryIds.has(c.id);
    });
    console.log('[类目循环] 共 ' + activeCats.length + ' 个类目将并行搜索:', activeCats.map(function (c) { return c.id; }).join(','));

    const results = await Promise.all(activeCats.map(function (cat) {
      return searchOneCategory(cat.id).catch(function (e) {
        console.warn('[类目循环] 类目 ' + cat.id + ' 最终失败: ' + e.message);
        return { products: [], categoryStats: [] };
      });
    }));

    for (const r of results) {
      const list = (r && r.products) || [];
      for (const p of list) {
        if (!seenIds.has(p.id)) {
          seenIds.add(p.id);
          allProducts.push(p);
        }
      }
      if (r && Array.isArray(r.categoryStats)) {
        mergedStats = mergedStats.concat(r.categoryStats);
      }
    }

    products = allProducts;
    categoryStats = mergedStats;
    window._debugRaw = 'categoryIdList=' + activeCats.map(function (c) { return c.id; }).join(',');

    if (!products.length) apiErrorMessage = '所选类目内暂无匹配商品';
  } catch (e) {
    console.warn('[类目优先] 搜索失败:', e.message);
    apiErrorMessage = e.message || '类目搜索失败';
    products = [];
    categoryStats = [];
  }
  window._lastApiError = apiErrorMessage;  apiDuration = performance.now() - apiStartTime;
  console.log('[耗时统计] OZON API:', formatDuration(apiDuration));
  updateTimingDisplay({ agent: agentDuration, api: apiDuration, total: performance.now() - totalStartTime });
  
  // 更新 Step 3: 类目分布分析结果
  if (categoryStats.length > 0) {
    const topCat = categoryStats[0];
    const catTags = categoryStats.map(c => {
      const fullName = fixRussianEncoding(String(c.name || '')).trim();
      const leafName = fullName.split('>').map(part => part.trim()).filter(Boolean).pop() || '类目';
      return leafName + '（ID: ' + c.id + '）' + c.ratio + '%';
    });
    updateStep(step3, '✅', 'Step 3: 类目分布分析', 
      '共覆盖 ' + categoryStats.length + ' 个类目 · Top类目占比 ' + topCat.ratio + '%',
      catTags
    );
  } else {
    updateStep(step3, '⚠️', 'Step 3: 类目分布分析', 
      '暂无类目数据');
  }
  
  if (products.length > 0) {
    const searchWords = russianKeywords.slice(0, 2);
    if (expanded.length > 0) searchWords.push(...expanded.slice(0, 2));
    const displaySearch = searchWords.join('、');
    const sourceLabel = '类目限定API';
    updateStep(step4, '✅', 'Step 4: OZON商品搜索完成',
      '搜索词：' + displaySearch + ' · 从OZON实时获取 ' + products.length + ' 条商品数据',
      [sourceLabel, products.length + '件商品']
    );
  } else {
    let errDetail = '请稍后重试或更换关键词';
    if (apiErrorMessage.includes('请求频率过高') || apiErrorMessage.includes('rate limit')) {
      errDetail = '⚠️ API请求频率过高被限流，已自动重试3次仍未恢复。请等待 30 秒后重试';
    } else if (apiErrorMessage) {
      errDetail = '错误：' + apiErrorMessage;
    }
    updateStep(step4, '⚠️', 'Step 4: OZON商品搜索', errDetail);
  }
  // 隐藏顶部loading
  const totalDuration = performance.now() - totalStartTime;
  console.log('[耗时统计] 总调用时间:', formatDuration(totalDuration));
  updateTimingDisplay({ agent: agentDuration, api: apiDuration, total: totalDuration });
  document.getElementById('analysis-loading').style.display = 'none';
  document.getElementById('analysis-sub').textContent = 'AI智能分析完成，已为您精准匹配OZON商品';
  // ===== 渲染商品 =====
  currentResults = products;
  renderProducts(products);
  } catch (e) {
    console.error('[搜索出错]', e);
    document.getElementById('product-grid').innerHTML = 
      '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">搜索出错: ' + escapeHtml(e.message) + '<br><br>请稍后重试或尝试其他关键词</div>';
  } finally {
    isSearching = false;
    btn.disabled = false;
  }
}
// ===== 渲染商品 =====
function renderProducts(products, page) {
  const total = products?.length || 0;
  document.getElementById('products-count').textContent = total + ' 件';
  const grid = document.getElementById('product-grid');
  const paginationEl = document.getElementById('pagination');
  const apiErrorMessage = window._lastApiError || '';
  
  if (!products || products.length === 0) {
    let emptyMsg = '暂无相关商品，请尝试其他关键词';
    if (apiErrorMessage && (apiErrorMessage.includes('请求频率过高') || apiErrorMessage.includes('rate limit'))) {
      emptyMsg = '⚠️ OZON API 请求频率过高被限流，请等待 30 秒后再试';
    }
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;">' + emptyMsg + '</div>';
    paginationEl.style.display = 'none';
    return;
  }
  
  const totalPages = Math.ceil(total / PAGE_SIZE);
  if (!page) page = 1;
  if (page < 1) page = 1;
  if (page > totalPages) page = totalPages;
  currentPage = page;
  
  const start = (page - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageProducts = products.slice(start, end);
  
  grid.innerHTML = '';
  pageProducts.forEach(p => {
    const card = document.createElement('a');
    card.className = 'product-card';
    card.href = p.link || '#';
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    
    let imgHtml = '';
    if (p.img) {
      imgHtml = '<img class="product-img" src="' + escapeHtml(p.img) + '" alt="' + escapeHtml(p.title) + '" onerror="this.parentElement.innerHTML=\'<div class=\\\'product-img-placeholder\\\'>📦</div>\'">';
    } else {
      imgHtml = '<div class="product-img-placeholder">📦</div>';
    }
    
    let badges = '';
    if (p.companyType === 1) {
      badges += '<span class="product-badge badge-cross">跨境</span>';
    } else if (p.companyType === 2) {
      badges += '<span class="product-badge badge-local">本地</span>';
    }
    if (p.workingMode) {
      const wm = String(p.workingMode).toUpperCase();
      if (wm.includes('FBO')) {
        badges += '<span class="product-badge badge-fbo">FBO</span>';
      } else if (wm.includes('FBS')) {
        badges += '<span class="product-badge badge-fbs">FBS</span>';
      }
    }
    if ((p.sales || 0) > 1000) badges += '<span class="product-badge badge-hot">热销</span>';
    if (p.matchedByRussian) badges += '<span class="product-badge badge-ru-match">俄语命中</span>';
    if (p.matchedByChinese) badges += '<span class="product-badge badge-cn-match">中文命中</span>';
    
    const priceRub = p.price ? Number(p.price).toLocaleString() : '0';
    const priceRmb = p.priceRmb ? '¥' + Number(p.priceRmb).toFixed(0) : '';
    
    const saleVol = p.saleVolume30d ? Number(p.saleVolume30d).toLocaleString() + ' ₽' : '--';
    
    card.innerHTML = `
      <div class="product-img-wrap">${imgHtml}</div>
      <div class="product-info">
        <div class="product-title">${badges}${escapeHtml(p.title)}</div>
        ${p.titleCn ? `<div class="product-title-cn">🇨🇳 ${escapeHtml(p.titleCn)}</div>` : ''}
        <div class="product-price">${priceRub} <span>₽</span><span class="product-price-rmb">${priceRmb}</span></div>
        <div class="product-meta">
          <span>月销 ${(p.sales || 0).toLocaleString()}</span>
          <span>⭐ ${p.score ? p.score.toFixed(1) : '--'}</span>
        </div>
        <div class="product-meta" style="margin-top:4px;">
          <span>月额 ${saleVol}</span>
          <span>${p.ratingNum ? p.ratingNum.toLocaleString() + '评价' : ''}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  
  renderPagination(total, totalPages, page);
  
  grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// ===== 渲染分页组件 =====
function renderPagination(total, totalPages, currentPage) {
  const paginationEl = document.getElementById('pagination');
  const pageNumbersEl = document.getElementById('page-numbers');
  const pageInfoEl = document.getElementById('page-info');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  
  if (totalPages <= 1) {
    paginationEl.style.display = 'none';
    return;
  }
  
  paginationEl.style.display = 'flex';
  
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
  
  pageInfoEl.textContent = `共 ${total} 件 · 第 ${currentPage}/${totalPages} 页`;
  
  const jumpInput = document.getElementById('jump-input');
  if (jumpInput) {
    jumpInput.value = currentPage;
    jumpInput.max = totalPages;
  }
  
  let pages = [];
  const showPages = 5;
  
  if (totalPages <= showPages + 2) {
    for (let i = 1; i <= totalPages; i++) {
      pages.push(i);
    }
  } else {
    if (currentPage <= 3) {
      pages = [1, 2, 3, 4, '...', totalPages];
    } else if (currentPage >= totalPages - 2) {
      pages = [1, '...', totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
    } else {
      pages = [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
    }
  }
  
  pageNumbersEl.innerHTML = '';
  pages.forEach(p => {
    const span = document.createElement('span');
    if (p === '...') {
      span.className = 'page-num ellipsis';
      span.textContent = '...';
    } else {
      span.className = 'page-num' + (p === currentPage ? ' active' : '');
      span.textContent = p;
      span.onclick = () => goToPage(p);
    }
    pageNumbersEl.appendChild(span);
  });
}
// ===== 翻页 =====
function changePage(delta) {
  goToPage(currentPage + delta);
}
function goToPage(page) {
  if (!currentResults || currentResults.length === 0) return;
  renderProducts(currentResults, page);
}
// ===== 跳转到指定页 =====
function jumpToPage() {
  const input = document.getElementById('jump-input');
  if (!input) return;
  const page = parseInt(input.value);
  const totalPages = Math.ceil(currentResults.length / PAGE_SIZE);
  if (!isNaN(page) && page >= 1 && page <= totalPages) {
    goToPage(page);
  } else {
    input.value = currentPage;
  }
}
// ===== 快捷搜索 =====
function quickSearch(keyword, displayName) {
  document.getElementById('search-input').value = displayName || keyword;
  doSearch();
}
// ===== 回车搜索 =====
document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doSearch();
  }
});
// ===== 跳转输入框回车跳转 =====
document.addEventListener('DOMContentLoaded', function() {
  const jumpInput = document.getElementById('jump-input');
  if (jumpInput) {
    jumpInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        jumpToPage();
      }
    });
  }
});
// ===== 排序切换 =====
document.getElementById('sort-filter').addEventListener('click', function(e) {
  if (!e.target.classList.contains('chip')) return;
  document.querySelectorAll('#sort-filter .chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  
  const sort = e.target.dataset.sort;
  let sorted = [...currentResults];
  
  if (sort === 'score') {
    sorted.sort((a, b) => {
      const scoreDiff = (b._relevance || 0) - (a._relevance || 0);
      if (Math.abs(scoreDiff) > 0.01) return scoreDiff;
      return (b.sales || 0) - (a.sales || 0);
    });
  } else if (sort === 'sales') {
    sorted.sort((a, b) => (b.sales || 0) - (a.sales || 0));
  } else if (sort === 'revenue') {
    sorted.sort((a, b) => (b.saleVolume30d || 0) - (a.saleVolume30d || 0));
  } else if (sort === 'growth') {
    sorted.sort((a, b) => (b.saleVolume30dRate || 0) - (a.saleVolume30dRate || 0));
  } else if (sort === 'price-low') {
    sorted.sort((a, b) => (a.price || 0) - (b.price || 0));
  } else if (sort === 'price-high') {
    sorted.sort((a, b) => (b.price || 0) - (a.price || 0));
  } else if (sort === 'rating') {
    sorted.sort((a, b) => (b.score || 0) - (a.score || 0));
  }
  
  currentResults = sorted;
  renderProducts(sorted, 1);
});
